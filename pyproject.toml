[project]
name = "werewolf_arena"
version = "0.1.0"
description = "A framework for evaluating the social reasoning skills of large language models (LLMs) through the game of Werewolf"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), flake8-bugbear (B), and type annotations (ANN)
select = ["E", "F", "I", "B", "W", "C90", "ANN"]
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by Black)
    # Additional ignores to match flake8 configuration
    "D300",  # Use """triple double quotes"""
    "D103",  # Missing docstring in public function
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    # Type annotation ignores
    "ANN101",  # Missing type annotation for self in method
    "ANN102",  # Missing type annotation for cls in classmethod
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
]

[tool.ruff.lint.isort]
known-first-party = ["werewolf"]

[tool.pytest.ini_options]
markers = [
    "ollama_integration: marks tests that require Ollama to be running (deselect with '-m \"not ollama_integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
