[project]
name = "werewolf_arena"
version = "0.1.0"
description = "A framework for evaluating the social reasoning skills of large language models (LLMs) through the game of Werewolf"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "W",
    "C90",
    "SIM",
    "PIE",
    "PLR",
    "RET",
    "ANN",
    "UP",
    "D",
    "N",
    "S",
    "BLE",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EM",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PT",
    "Q",
    "RSE",
    "SLOT",
    "TID",
    "TCH",
    "ARG",
    "PTH",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "E203",
    "E501",
    "EM101",
    "EM102",
    "ISC001",
    "PLC0415",
    "PLR0913",
    "PLW0603",
    "PTH103",
    "PTH107",
    "PTH109",
    "PTH110",
    "PTH119",
    "PTH123",
    "S311",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["PLR2004"]
"test_ollama_manual.py" = ["BLE001", "TRY300"]
"werewolf/apis.py" = ["TRY301"]
"werewolf/analysis.py" = ["BLE001", "PERF203"]
"werewolf/lm.py" = ["BLE001"]
"werewolf/runner.py" = ["BLE001"]
"tests/**/*.py" = ["ANN001", "ANN201", "PLR2004", "S101"]
"**/test_*.py" = ["ANN001", "ANN201", "PLR2004", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["werewolf"]
force-single-line = false

[tool.black]
line-length = 120
target-version = ["py38"]

[tool.mypy]
python_version = "3.12"
files = ["main.py"]
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
strict = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "absl.*",
    "boto3.*",
    "botocore.*",
    "jinja2.*",
    "marko.*",
    "openai.*",
    "pandas.*",
    "requests.*",
    "tqdm.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pylint.main]
enable = ["all"]
min-similarity-lines = 4
ignore-imports = true
load-plugins = []

[tool.pylint.messages_control]
disable = [
    "C0114",
    "C0115",
    "C0116",
    "R0903",
    "W0212",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id"]
const-rgx = "^([A-Z_][A-Z0-9_]*|__.*__|log)$"

[tool.pylint.design]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 7
min-public-methods = 1
max-public-methods = 20

[tool.pytest.ini_options]
markers = [
    "ollama_integration: marks tests that require Ollama to be running (deselect with '-m \"not ollama_integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
