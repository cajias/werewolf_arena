[project]
name = "werewolf_arena"
version = "0.1.0"
description = "A framework for evaluating the social reasoning skills of large language models (LLMs) through the game of Werewolf"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and flake8-bugbear (B)
select = ["E", "F", "I", "B", "W", "C90"]
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "E501",  # Line too long (handled by Black)
    # Additional ignores to match flake8 configuration
    "D300",  # Use """triple double quotes"""
    "D103",  # Missing docstring in public function
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
]

[tool.ruff.lint.isort]
known-first-party = ["werewolf"]
