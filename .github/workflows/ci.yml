name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-lint.txt

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install frontend dependencies
      run: npm ci

    - name: Run Ruff linter
      run: ruff check .

    - name: Run Black formatting check
      run: black --check .

    - name: Run MyPy
      run: mypy

    - name: Run Pylint duplicate code check
      run: pylint --disable=all --enable=duplicate-code main.py werewolf

    - name: Run Markdown lint
      run: npm run lint:md

    - name: Run Prettier check
      run: npm run format:check

    - name: Run ESLint
      run: npm run lint:ts

    - name: Verify TypeScript build
      run: npm run build

  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify installation
      run: |
        python -c "import werewolf; print('Package imported successfully')"
        python main.py --help || echo "Main script can be executed"

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=werewolf --cov-report=term-missing
